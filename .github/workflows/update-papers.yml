name: Update E-Paper Links

on:
  schedule:
    # Runs everyday at 02:30 UTC (08:30 AM Bangladesh Time)
    - cron: '30 2 * * *'
    # Runs everyday at 12:30 UTC (06:30 PM Bangladesh Time)
    - cron: '30 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python scripts/update_papers.py

      - name: Commit and push changes if papers updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add data/papers.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated daily e-paper links sync [skip ci]" && git push)
